services:
  vllm:
    image: vllm/vllm-openai:latest
    command: >
      --model ${VLLM_MODEL}
      --tensor-parallel-size 1
      --max-model-len ${VLLM_MAX_MODEL_LEN:-16384}
      --gpu-memory-utilization ${VLLM_MEM_UTIL:-0.65}
      --dtype auto
      --max-num-seqs ${VLLM_MAX_NUM_SEQS:-32}
      --max-num-batched-tokens ${VLLM_MAX_BATCHED_TOKENS:-4096}
      --port 8000
      --download-dir /root/.cache/huggingface
    environment:
      - VLLM_API_KEY=${VLLM_API_KEY}
      - HF_HOME=/root/.cache/huggingface
      - HF_HUB_ENABLE_HF_TRANSFER=1
    volumes:
      - /home/ubuntu/hf-cache:/root/.cache/huggingface
      - /home/ubuntu/vllm-cache:/root/.cache/vllm
    ports:
      - "8001:8000"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    runtime: nvidia

  app:
    build: .
    environment:
      - VLLM_BASE_URL=http://vllm:8000/v1
      - VLLM_MODEL=${VLLM_MODEL}
      - VLLM_API_KEY=${VLLM_API_KEY}
      - TRANSFORMERS_CACHE=/root/.cache/huggingface
      - PYTHONBUFFERED=1
    ports:
      - "8080:8080"
    runtime: nvidia
    volumes:
      - /home/ubuntu/hf-cache:/root/.cache/huggingface
      - /home/ubuntu/vllm-cache:/root/.cache/vllm
    depends_on:
      - vllm
