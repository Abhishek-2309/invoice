version: "3.9"
services:
  vllm:
    image: vllm/vllm-openai:latest
    command: >
      --model ${VLLM_MODEL}
      --tensor-parallel-size 1
      --max-model-len ${VLLM_MAX_MODEL_LEN:-16384}
      --gpu-memory-utilization ${VLLM_MEM_UTIL:-0.95}
      --dtype auto
      --max-num-seqs ${VLLM_MAX_NUM_SEQS:-32}
      --max-num-batched-tokens ${VLLM_MAX_BATCHED_TOKENS:-4096}
      --port 8000
    environment:
      - VLLM_API_KEY=${VLLM_API_KEY}
    ports:
      - "8001:8000"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    runtime: nvidia

  app:
    build: .
    environment:
      - VLLM_BASE_URL=http://vllm:8000/v1
      - VLLM_MODEL=${VLLM_MODEL}
      - VLLM_API_KEY=${VLLM_API_KEY}
      - UVICORN_WORKERS=2
    ports:
      - "8080:8080"
    depends_on:
      - vllm
